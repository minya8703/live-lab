<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>글 작성 · 기술 블로그</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="/blog/blog.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">민야령 <span class="brand-sub">Backend Live Lab</span></a>
    <nav class="nav">
      <a href="/#lab">Live Lab</a>
      <a href="/#proof">Proof</a>
      <a href="/blog.html">Blog</a>
      <a href="/career.html">전체 이력</a>
    </nav>
  </header>

  <main>
    <section class="blog-editor">
      <div class="blog-editor-header">
        <h1 data-editor-title>새 글 작성</h1>
        <div class="blog-editor-actions">
          <div class="auth-area" data-auth-area></div>
          <button class="btn btn-ghost" data-btn-draft>임시저장</button>
          <button class="btn btn-primary" data-btn-publish>발행</button>
        </div>
      </div>

      <div class="blog-field">
        <label for="title">TITLE</label>
        <input type="text" id="title" maxlength="300" required placeholder="글 제목 (최대 300자)" data-title />
      </div>

      <div class="blog-field">
        <label for="slug">SLUG</label>
        <input type="text" id="slug" maxlength="200" pattern="[a-z0-9가-힣]+(-[a-z0-9가-힣]+)*" placeholder="자동 생성 또는 소문자·숫자·한글·하이픈" data-slug />
      </div>

      <div class="blog-field">
        <label for="summary">SUMMARY</label>
        <input type="text" id="summary" maxlength="500" placeholder="한 줄 요약 (최대 500자)" data-summary />
      </div>

      <div class="blog-field">
        <label for="tags">TAGS</label>
        <input type="text" id="tags" maxlength="500" placeholder="Spring Boot, Kafka, Redis (최대 500자)" data-tags />
      </div>

      <div class="blog-field">
        <label for="thumbnail">THUMBNAIL URL</label>
        <input type="url" id="thumbnail" maxlength="500" placeholder="HTTP(S) 이미지 URL" data-thumbnail />
      </div>

      <div class="blog-upload-toolbar">
        <button type="button" class="btn btn-ghost blog-upload-btn" data-btn-upload>이미지 추가</button>
        <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden data-file-input />
        <span class="blog-upload-hint">PNG·JPEG·GIF·WebP, 파일당 10MB · 연결 peer 기준 시간당 20회</span>
        <span class="blog-upload-status" data-upload-status></span>
      </div>

      <div class="blog-editor-content">
        <div class="blog-editor-pane">
          <label>MARKDOWN</label>
          <textarea class="blog-editor-textarea" maxlength="100000" required data-content placeholder="마크다운 본문 (최대 100,000자)"></textarea>
        </div>
        <div class="blog-editor-pane">
          <label>PREVIEW</label>
          <div class="blog-preview blog-post-body" data-preview></div>
        </div>
      </div>
    </section>
  </main>

  <script src="/blog/auth.js" defer></script>
  <script src="/blog/write.js" defer></script>
</body>
</html>
