spring.application.name=live-lab
server.port=8080

# 응답 인코딩을 UTF-8 로 강제 — 일부 환경에서 Content-Type charset 누락 시 Latin-1 폴백 차단.
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Static files at /
spring.web.resources.static-locations=classpath:/static/
# Cache-busting: ?v=hash 를 Dockerfile 빌드 시 주입하므로 캐시 허용
spring.web.resources.cache.cachecontrol.max-age=86400
spring.web.resources.cache.cachecontrol.must-revalidate=true

# Google AI Studio (Gemini) — OpenAI 호환 엔드포인트로 호출.
# API key는 aistudio.google.com 에서 발급. 환경 변수 GOOGLE_API_KEY 로 주입하거나
# application-local.properties(gitignored)로 오버라이드.
spring.ai.openai.api-key=${GOOGLE_API_KEY:}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com
spring.ai.openai.chat.completions-path=/v1beta/openai/chat/completions
# 모델 후보: gemini-2.5-flash (디폴트) / gemini-2.0-flash / gemini-2.5-flash-lite
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.max-tokens=1024
spring.ai.openai.chat.options.temperature=0.2

# Spring AI 재시도 정책 — 챗봇 UX 우선. 기본값(10회·최대 3분)은 사용자 대기 부담이 너무 큼.
# 503(혼잡) 같은 일시 오류는 짧게 몇 번만 재시도하고 빠르게 사용자에게 알린다.
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=8s
spring.ai.retry.on-client-errors=false

# 경력 데이터 디렉토리 (프로젝트 루트 기준)
livelab.career.data-dir=data/career

# === U4 Redis 캐시 라이브 데모 ===
# Postgres — 자격증명·포트는 .env 단일 진실원에서 읽음.
# 호스트 포트는 기본 5433 (5432는 다른 로컬 Postgres가 점유하는 환경 대비).
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5433}/${POSTGRES_DB:livelab}
spring.datasource.username=${POSTGRES_USER:livelab}
spring.datasource.password=${POSTGRES_PASSWORD:livelab}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis (docker-compose의 redis 서비스)
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# Spring Cache → Redis 어댑터
spring.cache.type=redis
spring.cache.redis.time-to-live=60s
spring.cache.redis.cache-null-values=false

# === U5 Kafka 처리량 데모 ===
spring.kafka.bootstrap-servers=localhost:${KAFKA_HOST_PORT:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=livelab-orders-consumer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.minyaryung.livelab.domain.kafkademo
spring.kafka.consumer.properties.spring.json.value.default.type=com.minyaryung.livelab.domain.kafkademo.OrderEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=record
# 파티션 수와 동일한 컨슈머 스레드 — 한 스레드의 재시도가 다른 파티션 처리를 막지 않게.
spring.kafka.listener.concurrency=3

livelab.kafka.topic.orders=livelab.orders
livelab.kafka.topic.orders-dlt=livelab.orders.DLT
livelab.kafka.consumer.retry.interval-ms=500
livelab.kafka.consumer.retry.max-attempts=3

# Kafka 클라이언트 로그/텔레메트리 노이즈 줄임:
# - 브로커로의 텔레메트리 푸시 (Kafka 3.7+ 기본 ON) 비활성화 → 5분마다 푸시 로그/네트워크 제거.
# - kafka 패키지 INFO 로그 → WARN 으로 (heartbeat, rebalance 알림 등 일상 로그 음소거).
spring.kafka.consumer.properties.enable.metrics.push=false
spring.kafka.producer.properties.enable.metrics.push=false
logging.level.org.apache.kafka=WARN
logging.level.org.apache.kafka.clients.consumer.internals=WARN

# === U6 Actuator + Prometheus ===
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
# 모든 메트릭에 application=live-lab 태그 부착 → Prometheus 쿼리에서 필터 가능.
management.metrics.tags.application=live-lab
# HTTP 응답 시간 히스토그램 활성화 (P95 등 분위수 측정 가능)
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# 데모용 시드 데이터 규모
# (카테고리 목록은 DemoCategories.java에 정의 — properties 인코딩 사고 회피)
livelab.demo.product-count=100000

# 현재 빌드 진행 상태는 UnitProgress.java 의 Java 상수에서 읽는다.
# Korean 라벨이 properties 에 있으면 Spring 이 ISO-8859-1 로 해석해 mojibake 가 발생할 수 있어
# 의도적으로 properties 에서 제거했다. 자세한 이유는 data/devlog/05-encoding-bug.md 참조.
livelab.devlog.data-dir=data/devlog
livelab.ops.data-dir=data/ops

# === Auth (Google OAuth + JWT) ===
livelab.auth.google-client-id=${GOOGLE_CLIENT_ID:not-configured}
livelab.auth.master-email=${BLOG_MASTER_EMAIL:not-configured}
livelab.auth.jwt-secret=${JWT_SECRET:default-jwt-secret-for-dev-only-32ch}
livelab.auth.jwt-expiration-ms=86400000

# === Blog (S3 + Postgres) ===

# S3 storage (NAS MinIO 전환 시 endpoint만 변경)
livelab.blog.s3.endpoint=${STORAGE_ENDPOINT:https://s3.ap-northeast-2.amazonaws.com}
livelab.blog.s3.region=${STORAGE_REGION:ap-northeast-2}
livelab.blog.s3.access-key=${STORAGE_ACCESS_KEY:}
livelab.blog.s3.secret-key=${STORAGE_SECRET_KEY:}
livelab.blog.s3.bucket=${STORAGE_BUCKET:livelab-blog}
livelab.blog.s3.public-url=${STORAGE_PUBLIC_URL:https://livelab-blog.s3.ap-northeast-2.amazonaws.com}

# 파일 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
