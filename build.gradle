plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.minyaryung'
version = '0.1.0-SNAPSHOT'
description = '민야령 Backend Live Lab'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', '1.0.0')
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // U3: Spring AI — Google AI Studio(Gemini)를 OpenAI 호환 엔드포인트로 호출.
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // .env 자동 로드 (프로젝트 루트의 .env → Spring Environment)
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // U4: Redis 캐시 + JPA + Postgres
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'org.postgresql:postgresql'

    // U5: Kafka
    implementation 'org.springframework.kafka:spring-kafka'

    // U6: Actuator + Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // U7: 개발 일지 마크다운 렌더링
    implementation 'org.commonmark:commonmark:0.22.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'

    // === Test ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:kafka'
    testImplementation 'com.redis:testcontainers-redis:2.2.2'
    testImplementation 'org.springframework.kafka:spring-kafka-test'
    testImplementation 'org.awaitility:awaitility'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // Testcontainers 가 충분히 기다리도록
    systemProperty 'testcontainers.reuse.enable', 'true'
}

// 빌드 시 표준 출력에 한국어가 깨지지 않게
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}
