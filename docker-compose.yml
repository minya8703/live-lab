services:
  # Spring Boot 앱 — prod profile 일 때만 기동 (개발에서는 ./gradlew bootRun 으로 호스트에서 실행).
  # 사용:
  #   - 개발: docker compose up -d                (deps 만)
  #   - 운영: docker compose --profile prod up -d (deps + 앱)
  app:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: livelab-app
    ports:
      - "${APP_HOST_PORT:-8089}:8089"
    environment:
      # 컨테이너 네트워크 내부 호스트로 오버라이드 (Spring Boot 가 SPRING_DATASOURCE_URL 등을 env 우선)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-livelab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-livelab}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-livelab}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: livelab-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: livelab-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-livelab}
      POSTGRES_USER: ${POSTGRES_USER:-livelab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-livelab}
    ports:
      # 호스트 포트는 .env의 POSTGRES_HOST_PORT (기본 5433 — 5432는 다른 로컬 Postgres 점유 가능성 회피).
      # 컨테이너 내부는 항상 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-livelab} -d ${POSTGRES_DB:-livelab}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  kafka:
    # Apache 공식 KRaft 이미지 — Bitnami는 2025년부터 일부 태그 유료화로 신뢰성 떨어짐.
    image: apache/kafka:3.7.0
    container_name: livelab-kafka
    ports:
      - "${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      # KRaft 모드 — Zookeeper 없이 단일 노드(broker + controller 겸용).
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # KRaft는 클러스터에 고정 UUID 필요 — 첫 기동 시 storage 포맷에 사용.
      CLUSTER_ID: "livelab-kafka-cluster-001"
      # 단일 노드라 ISR/replication factor를 1로 강제.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: livelab-prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: livelab-grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: "light"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_FEATURE_TOGGLES_ENABLE: "publicDashboards"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  kafka-data:
  prometheus-data:
  grafana-data:
