name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          port: 22
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          timeout: 60s
          command_timeout: 10m
          script: |
            cd ${{ secrets.EC2_APP_DIR }}
            echo "=== Pull ==="
            git pull origin main || { echo "FAIL: git pull"; exit 1; }
            echo "=== Build ==="
            docker compose --profile prod build --no-cache app || { echo "FAIL: build"; exit 1; }
            echo "=== Restart ==="
            docker compose --profile prod up -d || { echo "FAIL: up"; exit 1; }
            docker image prune -f > /dev/null 2>&1 || true
            echo "=== Health check (max 120s) ==="
            for i in $(seq 1 24); do
              sleep 5
              if curl -sf --max-time 3 http://localhost:80/actuator/health > /dev/null 2>&1; then
                echo "OK: App is healthy after $((i*5))s"
                exit 0
              fi
              echo "  waiting... ($((i*5))s)"
            done
            echo "FAIL: health check timeout"
            docker logs --tail 50 livelab-app 2>&1 || true
            exit 1
