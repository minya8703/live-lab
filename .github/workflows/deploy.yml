name: Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          port: 22
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          passphrase: ${{ secrets.EC2_SSH_PASSPHRASE }}
          timeout: 60s
          command_timeout: 10m
          debug: true
          script: |
            cd ${{ secrets.EC2_APP_DIR }}

            echo "=== Pull latest code ==="
            git pull origin main || { echo "git pull failed"; exit 1; }

            echo "=== Build & restart containers ==="
            docker compose --profile prod build --no-cache app || { echo "build failed"; exit 1; }
            docker compose --profile prod up -d || { echo "up failed"; exit 1; }

            echo "=== Cleanup dangling images ==="
            docker image prune -f || true

            echo "=== Container status ==="
            docker compose --profile prod ps || true

            echo "=== Health check ==="
            HEALTHY=false
            for i in $(seq 1 60); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${APP_HOST_PORT:-8080}/actuator/health 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "App is healthy! (HTTP $HTTP_CODE)"
                HEALTHY=true
                break
              fi
              echo "Waiting... ($i/60) HTTP=$HTTP_CODE"
              sleep 3
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "=== Health check FAILED ==="
              docker compose --profile prod logs --tail=80 app || true
              exit 1
            fi
